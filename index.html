<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Page</title>
    <!-- Tối ưu: Dùng Bootstrap CDN để giao diện đẹp và nhẹ -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
      body { padding: 20px; font-family: Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Chào mừng đến với Trang Chủ</h1>
        <p class="col-md-8 fs-4">Giao diện dành riêng cho khách hàng và người dùng phổ thông.</p>
        <!-- Đường dẫn chuyển nhanh sang trang Admin để bạn kiểm tra -->
        <a id="adminLink" class="btn btn-primary btn-lg" href="#" target="_top">Truy cập Admin</a>
      </div>
    </div>

    <script>
      // Tự động cấu hình URL động để chuyển sang trang admin
      window.addEventListener('load', function() {
        google.script.run.withSuccessHandler(function(url) {
          document.getElementById('adminLink').href = url + "?page=admin";
        }).getServiceUrl();
      });
    </script>
  </body>
</html>
