<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu lịch làm việc</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui}.wrap{overflow:auto;max-height:72vh}.t{border-collapse:separate;border-spacing:0;min-width:max-content}.t th,.t td{border-bottom:1px solid #e2e8f0;border-right:1px solid #e2e8f0;padding:6px;text-align:center}.t thead th{position:sticky;top:0;background:#eaf0f7;z-index:2}.t .left{position:sticky;left:0;background:white;text-align:left;z-index:1;min-width:210px}.t thead .left{z-index:3;background:#dbe5f1}.shift{font-weight:700;border-radius:5px;padding:3px 5px;display:inline-block;min-width:34px}</style></head><body class="bg-slate-100 text-slate-800"><header class="bg-slate-900 text-white p-5"><div class="max-w-screen-2xl mx-auto"><h1 class="text-2xl font-bold">Tra cứu lịch làm việc</h1><p class="text-slate-300 text-sm mt-1">Lịch đã được bộ phận xác nhận và công bố</p></div></header><main class="max-w-screen-2xl mx-auto p-3 md:p-6 space-y-4"><section class="bg-white rounded-xl p-4 flex flex-wrap gap-3 items-end shadow-sm"><label class="text-sm">Tháng<input id="month" type="month" class="block border rounded-lg p-2 mt-1" /></label><label class="flex-1 min-w-56 text-sm">Tìm nhân viên<input id="q" placeholder="Mã NV, mã chấm công, họ tên..." class="block w-full border rounded-lg p-2 mt-1" /></label><label class="text-sm">Bộ phận<select id="dept" class="block border rounded-lg p-2 mt-1"><option value="">Tất cả bộ phận</option></select></label><button id="load" class="bg-blue-700 text-white rounded-lg px-4 py-2">Tải lịch</button><button id="export" class="border rounded-lg px-4 py-2">Xuất Excel</button><button onclick="print()" class="border rounded-lg px-4 py-2">In</button><a href="admin.html" class="text-blue-700 underline px-2 py-2">Đăng nhập bộ phận / Admin</a></section><section class="grid grid-cols-2 md:grid-cols-3 gap-3"><div class="bg-white rounded-xl p-4"><div class="text-xs text-slate-500">Nhân viên</div><b id="nEmp" class="text-2xl">0</b></div><div class="bg-white rounded-xl p-4"><div class="text-xs text-slate-500">Lượt phân ca</div><b id="nShift" class="text-2xl">0</b></div><div class="bg-white rounded-xl p-4"><div class="text-xs text-slate-500">Trạng thái</div><b id="status" class="text-sm">Chưa tải</b></div></section><section class="bg-white rounded-xl shadow-sm p-3"><div id="title" class="font-bold mb-3">Lịch làm việc</div><div class="wrap"><table id="table" class="t w-full"></table></div></section><p class="text-xs text-slate-500">Trang tra cứu chỉ đọc dữ liệu đã công bố; không có chức năng chỉnh sửa hoặc duyệt lịch.</p></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const API='https://script.google.com/macros/s/AKfycbzn4ymnmgcmSqrFS3wX0pmYmclCA31G4QCVw290QnrbHJfN0K71xvUOtsPskHLmxP9R/exec';let employees=[],month=new Date().toISOString().slice(0,7);document.getElementById('month').value=month;
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function days(){let [y,m]=month.split('-').map(Number);return new Date(y,m,0).getDate()}function date(d){return `${month}-${String(d).padStart(2,'0')}`}function labelShift(v){return `<span class="shift">${esc(v)}</span>`}
async function load(){month=$('month').value;if(!month)return alert('Chọn tháng.');$('status').textContent='Đang tải…';try{let r=await fetch(API+'?action=schedule_get&month='+encodeURIComponent(month));let j=await r.json();if(j.status!=='success')throw Error(j.message||'API lỗi');employees=j.employees||[];render();$('status').textContent='Đã tải';}catch(e){$('status').textContent='Lỗi API';alert('Không tải được lịch: '+e.message)}}function render(){let q=$('q').value.trim().toLocaleLowerCase('vi'),dep=$('dept').value,rows=employees.filter(e=>(!dep||e.section===dep)&&[e.id,e.maChamCong,e.name,e.dept,e.section,e.position].join(' ').toLocaleLowerCase('vi').includes(q));let depts=[...new Set(employees.map(e=>e.section).filter(Boolean))].sort();let old=$('dept').value;$('dept').innerHTML='<option value="">Tất cả bộ phận</option>'+depts.map(d=>`<option>${esc(d)}</option>`).join('');$('dept').value=depts.includes(old)?old:'';let n=days();$('title').textContent='Lịch làm việc tháng '+month;$('nEmp').textContent=rows.length;$('nShift').textContent=rows.reduce((a,e)=>a+Object.values(e.shifts||{}).filter(Boolean).length,0);let h='<thead><tr><th class="left">Nhân viên / Bộ phận</th><th>Mã chấm công</th>';for(let d=1;d<=n;d++)h+=`<th>${d}</th>`;h+='</tr></thead><tbody>';for(let e of rows){h+=`<tr><td class="left"><b>${esc(e.name)}</b><div class="text-xs text-slate-500">${esc(e.id)} · ${esc(e.section||e.dept)}</div></td><td>${esc(e.maChamCong)}</td>`;for(let d=1;d<=n;d++){let v=(e.shifts||{})[date(d)]||'';h+=`<td>${v?labelShift(v):'—'}</td>`}h+='</tr>'}h+='</tbody>';$('table').innerHTML=h}function exportX(){let n=days(),data=[['Mã NV','Mã chấm công','Họ tên','Phòng ban','Bộ phận','Chức vụ',...Array.from({length:n},(_,i)=>i+1)]];employees.forEach(e=>data.push([e.id,e.maChamCong,e.name,e.dept,e.section,e.position,...Array.from({length:n},(_,i)=>(e.shifts||{})[date(i+1)]||'')]));let w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(data),'Lich '+month);XLSX.writeFile(w,'Lich_lam_viec_'+month+'.xlsx')}$('load').onclick=load;$('q').oninput=render;$('dept').onchange=render;$('export').onclick=exportX;load();
</script></body></html>
